server:
  port: 8081

spring:
  application:
    name: short-url-server

  # ===== 数据源配置 (请改成你自己的 MySQL 账号密码) =====
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/short_url?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  # ===== Redis 配置 (没有密码就把 password 注释掉) =====
  data:
    redis:
      host: localhost
      port: 6379
      # password: 你的Redis密码
      database: 0
      timeout: 5000ms

  # ===== RabbitMQ 配置 (阶段3 异步点击统计) =====
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    # 生产者确认: broker 收到消息后回执, 提升可靠性
    # (convertAndSend 默认发后不管, 发送失败仅记录日志, 不阻塞跳转)
    publisher-confirm-type: correlated
    publisher-returns: true

# ===== MyBatis-Plus 配置 =====
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
  mapper-locations: classpath:/mapper/*.xml

# ===== 短链业务配置 =====
short-url:
  # 短链域名前缀(本地开发用,生产环境换成自己的域名)
  domain: "http://localhost:8081/"
  # Redis 缓存 key 前缀
  cache-prefix: "short:url:"
  # 缓存过期天数
  cache-ttl-days: 7
  # 点击统计模式开关: true=RabbitMQ 异步(阶段2, 默认), false=同步 UPDATE(阶段1 退化/降级)
  click:
    async-enabled: true
    # 压测专用: 模拟下游 DB 写入耗时(ms), 用于演示 MQ 解耦"慢下游"的收益; 0=不模拟
    simulate-db-latency-ms: 0
  # ===== MQ 队列/交换机名称 (阶段2) =====
  mq:
    # 正常链路: 跳转发送点击事件 -> 消费者异步 +1
    click-exchange: "short-url.click.exchange"
    click-queue: "short-url.click.queue"
    click-routing-key: "short-url.click.routing"
    # 死信链路: 消费失败(拒绝且不重入队) -> 进入死信队列等待人工排查/重放
    dlx-exchange: "short-url.dlx.exchange"
    dlx-queue: "short-url.click.dlx.queue"
    dlx-routing-key: "short-url.click.dlx.routing"
    # ===== 批量消费配置 (始终开启, 无关闭开关) =====
    # 批量与单条的监听器方法签名不兼容, 不做运行时开关;
    # 需要"逐条"基线做 A/B 对比时, 用阶段2 原始代码打包运行即可。
    # 每批最大消息数 (攒满/超时二选一触发交付); 越大压缩比越好但延迟略高
    batch-size: 100
    # 攒不够 batch-size 时的等待上限 (ms); 越大批越满但单条延迟越高; 建议 100~500ms
    batch-timeout-ms: 200

logging:
  level:
    com.shorturl: debug
